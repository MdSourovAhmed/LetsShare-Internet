networks:
  letshare-net:
    driver: bridge

services:
  backend:
    profiles:
      - dev
      - dev-net

    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "5000"

    environment:
      PORT: 5000

    networks:
      - letshare-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3

    networks:
      - letshare-net
